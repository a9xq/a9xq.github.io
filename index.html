<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quietly kept.</title>

    <style>
    * {
        box-sizing: border-box;
    }

    html, body {
        width: 100%;
        height: 100%;
        margin: 0;
    }

    body {
        overflow: hidden;
        background: #e9edf2;
        font-family:
        -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Inter, Helvetica, Arial, sans-serif;
        color: #111318;
    }/* =========================
       Animated liquid background
       ========================= */

    .background {
        position: fixed;
        inset: -20%;
        overflow: hidden;
        filter: blur(45px);
        background:
        radial-gradient( circle at 50% 50%, rgba(255, 255, 255, 0.95), rgba(232, 237, 243, 0.8) 45%, rgba(218, 225, 233, 0.9)
        );
    }

    .blob {
        position: absolute;
        width: 42vw;
        height: 42vw;
        min-width: 350px;
        min-height: 350px;
        border-radius: 50%;
        opacity: 0.68;
        will-change: transform, filter;
        /* The rainbow transition */
        animation:
        rainbow 28s linear infinite, breathe 16s ease-in-out infinite alternate;
    }/* Each blob starts at a different point in the spectrum */
    .blob:nth-child(1) {
        left: 5%;
        top: 0%;
        background:
        radial-gradient( circle at 40% 40%, rgba(255, 255, 255, 0.95), hsl(220 85% 78% / 0.72), transparent 70%
        );
        animation:
        driftOne 20s ease-in-out infinite alternate, rainbowOne 32s linear infinite, breathe 15s ease-in-out infinite alternate;
    }

    .blob:nth-child(2) {
        right: 0%;
        top: 5%;
        background:
        radial-gradient( circle at 50% 50%, rgba(255, 255, 255, 0.9), hsl(285 80% 80% / 0.68), transparent 70%
        );
        animation:
        driftTwo 24s ease-in-out infinite alternate, rainbowTwo 38s linear infinite;
    }

    .blob:nth-child(3) {
        left: 25%;
        bottom: -15%;
        background:
        radial-gradient( circle at 50% 50%, rgba(255, 255, 255, 0.9), hsl(170 70% 76% / 0.68), transparent 70%
        );
        animation:
        driftThree 22s ease-in-out infinite alternate, rainbowThree 34s linear infinite, breathe 18s ease-in-out infinite alternate;
    }

    .blob:nth-child(4) {
        right: 15%;
        bottom: -20%;
        background:
        radial-gradient( circle at 50% 50%, rgba(255, 255, 255, 0.85), hsl(345 80% 82% / 0.62), transparent 70%
        );
        animation:
        driftFour 27s ease-in-out infinite alternate, rainbowFour 42s linear infinite;
    }/* =========================
       Slow rainbow color shifts
       ========================= */
    @keyframes rainbowOne {
        0% {
            filter: hue-rotate(0deg);
        }

        25% {
            filter: hue-rotate(90deg);
        }

        50% {
            filter: hue-rotate(180deg);
        }

        75% {
            filter: hue-rotate(270deg);
        }

        100% {
            filter: hue-rotate(360deg);
        }
    }

    @keyframes rainbowTwo {
        0% {
            filter: hue-rotate(70deg);
        }

        25% {
            filter: hue-rotate(160deg);
        }

        50% {
            filter: hue-rotate(250deg);
        }

        75% {
            filter: hue-rotate(340deg);
        }

        100% {
            filter: hue-rotate(430deg);
        }
    }

    @keyframes rainbowThree {
        0% {
            filter: hue-rotate(150deg);
        }

        25% {
            filter: hue-rotate(240deg);
        }

        50% {
            filter: hue-rotate(330deg);
        }

        75% {
            filter: hue-rotate(420deg);
        }

        100% {
            filter: hue-rotate(510deg);
        }
    }

    @keyframes rainbowFour {
        0% {
            filter: hue-rotate(230deg);
        }

        25% {
            filter: hue-rotate(320deg);
        }

        50% {
            filter: hue-rotate(410deg);
        }

        75% {
            filter: hue-rotate(500deg);
        }

        100% {
            filter: hue-rotate(590deg);
        }
    }/* =========================
       Existing movement
       ========================= */
    @keyframes driftOne {
        from {
            transform: translate3d(-5vw, -3vh, 0) scale(1);
        }

        to {
            transform: translate3d(14vw, 10vh, 0) scale(1.18);
        }
    }

    @keyframes driftTwo {
        from {
            transform: translate3d(5vw, -4vh, 0) scale(1);
        }

        to {
            transform: translate3d(-14vw, 15vh, 0) scale(1.15);
        }
    }

    @keyframes driftThree {
        from {
            transform: translate3d(-10vw, 5vh, 0) scale(1.1);
        }

        to {
            transform: translate3d(12vw, -12vh, 0) scale(0.95);
        }
    }

    @keyframes driftFour {
        from {
            transform: translate3d(8vw, 8vh, 0) scale(0.95);
        }

        to {
            transform: translate3d(-10vw, -12vh, 0) scale(1.15);
        }
    }

    @keyframes breathe {
        from {
            scale: 0.95;
        }

        to {
            scale: 1.08;
        }
    }/* =========================
           Glass card
           ========================= */

    .glass {
        position: fixed;
        left: 50%;
        top: 50%;
        width: min(620px, calc(100vw - 40px));
        min-height: 300px;
        transform: translate(-50%, -50%);
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid rgba(255, 255, 255, 0.7);
        border-radius: 36px;
        background:
        linear-gradient( 135deg, rgba(255, 255, 255, 0.46), rgba(255, 255, 255, 0.18)
        );
        backdrop-filter:
        blur(34px)
        saturate(170%)
        brightness(1.05);
        -webkit-backdrop-filter:
        blur(34px)
        saturate(170%)
        brightness(1.05);
        box-shadow:
        0 30px 80px rgba(70, 80, 100, 0.14), inset 0 1px 1px rgba(255, 255, 255, 0.8), inset 0 -1px 1px rgba(255, 255, 255, 0.2);
        z-index: 3;
    }

    .glass::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        pointer-events: none;
        background:
        linear-gradient( 125deg, rgba(255, 255, 255, 0.45), transparent 25%, transparent 70%, rgba(255, 255, 255, 0.18)
        );
    }

    .glass::after {
        content: "";
        position: absolute;
        inset: 1px;
        border-radius: inherit;
        pointer-events: none;
        box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.16);
    }

    .content {
        position: relative;
        z-index: 2;
        text-align: center;
        padding: 60px 30px;
    }

    .title {
        margin: 0;
        font-size: clamp(3rem, 7vw, 5.5rem);
        font-weight: 600;
        letter-spacing: -0.065em;
        line-height: 0.95;
        color: rgba(15, 18, 24, 0.9);
        cursor: default;
        user-select: none;
        transition:
        transform 0.7s cubic-bezier(.16, 1, .3, 1), letter-spacing 0.7s cubic-bezier(.16, 1, .3, 1), filter 0.7s ease;
    }/*
          One basic but distinctive hover animation:
          the entire title subtly floats upward,
          expands, and gets a soft glass reflection.
        */

    .title:hover {
        transform:
        translateY(-7px)
        scale(1.025);
        letter-spacing: -0.045em;
        filter:
        drop-shadow(0 12px 22px rgba(70, 80, 100, 0.16));
    }

    .subtitle {
        margin: 22px 0 0;
        font-size: 14px;
        font-weight: 450;
        letter-spacing: -0.01em;
        color: rgba(20, 25, 35, 0.48);
    }/* =========================
           Grain
           ========================= */

    .grain {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
        opacity: 0.035;
        background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E");
    }

    @media (max-width: 600px) {
        .glass {
            min-height: 260px;
            border-radius: 30px;
        }

        .content {
            padding: 50px 20px;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        .blob {
            animation: none !important;
        }

        .title {
            transition: none;
        }
    }
    </style>
</head>

<body>

    <div class="background">
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
        <div class="blob"></div>
    </div>

    <div class="cursor-light"></div>

    <main class="glass">
        <div class="content">
            <h1 class="title">Quietly kept.</h1>
            <p class="subtitle">A small corner of the internet.</p>
        </div>
    </main>

    <div class="grain"></div>

    <script>
    const light = document.querySelector(".cursor-light");

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    let lightX = mouseX;
    let lightY = mouseY;

    window.addEventListener("pointermove", (event) => {
        mouseX = event.clientX;
        mouseY = event.clientY;
    });

    function animate() {
        lightX += (mouseX - lightX) * 0.08;
        lightY += (mouseY - lightY) * 0.08;

        light.style.left = `${lightX}px`;
        light.style.top = `${lightY}px`;

        requestAnimationFrame(animate);
    }

    animate();
    </script>

</body>
</html>
